services:
  database:
    image: postgres:16-alpine
    container_name: biovault-postgres
    environment:
      POSTGRES_DB: biobank
      POSTGRES_USER: biobank
      POSTGRES_PASSWORD: biobank_dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biobank -d biobank"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - biovault_pgdata:/var/lib/postgresql/data
      - ./sql:/project/sql:ro

volumes:
  biovault_pgdata:
